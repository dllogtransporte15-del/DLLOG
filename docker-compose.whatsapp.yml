version: '3.8'

services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_secret_2026
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    depends_on:
      - evolution-postgres
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_TYPE: http
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: c1f7333c96962458559ec3b861d0046b4a479d23a51e897c6f4d9129475509bc
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_CREDENTIALS: "true"
      
      # Banco de dados
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution_secret_2026@evolution-postgres:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "transcunha_evolution"
      
      # Configurações de Sessão e Cache
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      
      # WhatsApp Baileys
      CONFIG_SESSION_PHONE_CLIENT: "Transcunha Logística"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      
      # Webhooks e Eventos
      WEBHOOK_GLOBAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution-net

volumes:
  evolution_pg_data:
  evolution_instances:
  evolution_store:

networks:
  evolution-net:
    driver: bridge
