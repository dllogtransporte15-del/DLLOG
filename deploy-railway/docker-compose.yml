version: '3.8'

services:
  evolution-postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-evolution}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-evolution_secret_2026_transcunha}
      POSTGRES_DB: ${DATABASE_NAME:-evolution}
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: always
    volumes:
      - evolution_redis_data:/data
    networks:
      - evolution-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: evolution-api
    restart: always
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_TYPE: http
      SERVER_URL: ${SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:-transcunha_secure_api_key_2026_x9}
      
      # CORS
      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
      CORS_CREDENTIALS: "true"
      
      # Banco de dados Postgres
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://${DATABASE_USER:-evolution}:${DATABASE_PASSWORD:-evolution_secret_2026_transcunha}@evolution-postgres:5432/${DATABASE_NAME:-evolution}?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: "transcunha_evolution"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      
      # Cache Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://evolution-redis:6379"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      CACHE_LOCAL_ENABLED: "false"
      
      # Identificação da Sessão WhatsApp
      CONFIG_SESSION_PHONE_CLIENT: "Transcunha Logística"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      
      # Webhooks globais
      WEBHOOK_GLOBAL_ENABLED: "false"
      
      # Delays de envio e segurança
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - evolution-net

volumes:
  evolution_pg_data:
  evolution_redis_data:
  evolution_instances:
  evolution_store:

networks:
  evolution-net:
    driver: bridge
